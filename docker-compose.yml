services:
  mongodb:
    image: mongo:7
    container_name: shubh-power-mongodb
    ports:
      - "27017:27017"
    volumes:
      - shubh_power_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shubh-power-backend
    env_file:
      - .env.example
    environment:
      MONGODB_URL: mongodb://mongodb:27017
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  shubh_power_mongo:
